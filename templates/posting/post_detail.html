{% extends 'success.html' %}
{% block  content %}

<h1>{{ post.title }}</h1>
<p>{{ post.body }}</p>
<p>Author: {{ post.author }}</p>

{% if user == post.author or user.role == 'admin' %}
    <a href="{% url 'post_edit' post.id %}">Edit</a>
    <a href="{% url 'post_delete' post.id %}">Delete</a>
{% endif %}
<a href="{% url 'post_list' %}">Back</a>
{% endblock %}
